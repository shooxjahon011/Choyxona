<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UY Choyxonasi - Bosh Sahifa</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body {
            min-height: 100vh; display: flex; justify-content: center; align-items: center; background-color: #0c0c0c; position: relative; padding: 20px;
        }
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?q=80&w=1920&auto=format&fit=crop');
            background-size: cover; background-position: center; background-attachment: fixed; filter: blur(10px) brightness(35%); z-index: -1;
        }
        .menu-container {
            width: 100%; max-width: 550px; background: rgba(255, 255, 255, 0.06); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 28px; padding: 40px; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6); color: #ffffff; text-align: center;
        }
        .header h1 {
            font-size: 3rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
            background: linear-gradient(135deg, #ff9f43, #ff5252); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 12px;
        }
        .header p { font-size: 1.1rem; color: #ccc; margin-bottom: 40px; font-weight: 300; }
        .btn-container { display: flex; flex-direction: column; gap: 20px; }
        .category-btn {
            display: block; padding: 20px; background: rgba(255, 159, 67, 0.1); border: 1px solid rgba(255, 159, 67, 0.3);
            border-radius: 18px; color: #fff; text-decoration: none; font-size: 1.3rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s ease;
        }
        .category-btn:hover {
            background: linear-gradient(135deg, #ff9f43, #ff5252); transform: translateY(-4px); box-shadow: 0 10px 20px rgba(255, 82, 82, 0.3); border-color: transparent;
        }
        @media (max-width: 576px) { .header h1 { font-size: 2rem; } .category-btn { font-size: 1.1rem; padding: 15px; } }
    </style>
</head>
<body>
    <div class="menu-container">
        <header class="header">
            <h1>UY Choyxonasi</h1>
            <p>BO`LIMLARNI TANLANG!</p>
        </header>
        <div class="btn-container">
            <a href="{% url 'shashlik_url' %}" class="category-btn">Shashliklar</a>
            <a href="{% url 'salat_url' %}" class="category-btn">Salatlar</a>
            <a href="{% url 'yaxna_url' %}" class="category-btn">Yaxna Ichimliklar</a>
        </div>
    </div>
</body>
</html>
