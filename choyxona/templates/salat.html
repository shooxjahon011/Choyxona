<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salatlar - UY Choyxonasi</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* CSS uslublari shashlik.html bilan mutlaqo bir xil va moslashtirilgan */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { min-height: 100vh; display: flex; justify-content: center; align-items: center; background-color: #0c0c0c; position: relative; overflow-x: hidden; padding: 40px 20px; }
        body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?q=80&w=1920&auto=format&fit=crop'); background-size: cover; background-position: center; background-attachment: fixed; filter: blur(10px) brightness(35%); z-index: -1; }
        .menu-container { width: 100%; max-width: 950px; background: rgba(255, 255, 255, 0.06); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 28px; padding: 40px; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6); color: #ffffff; }
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-size: 3.2rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; background: linear-gradient(135deg, #ff9f43, #ff5252); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #ff9f43; text-decoration: none; font-size: 1.1rem; font-weight: 500; transition: 0.3s; }
        .back-link:hover { color: #ff5252; transform: translateX(-5px); }
        .menu-section { margin-bottom: 20px; }
        .menu-grid { display: grid; grid-template-columns: 1fr; gap: 25px; }
        @media (min-width: 768px) { .menu-grid { grid-template-columns: 1fr 1fr; } }
        .menu-item { display: flex; align-items: center; gap: 20px; padding: 15px; border-radius: 18px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); }
        .menu-item:hover { background: rgba(255, 255, 255, 0.09); transform: translateY(-4px); border-color: rgba(255, 159, 67, 0.4); box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3); }
        .item-img { width: 90px; height: 90px; border-radius: 14px; object-fit: cover; box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4); border: 2px solid rgba(255, 255, 255, 0.1); }
        .item-details { flex: 1; }
        .item-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; gap: 10px; }
        .item-name { font-size: 1.15rem; font-weight: 600; color: #ffffff; }
        .item-price { font-size: 1.1rem; font-weight: 700; color: #ff9f43; white-space: nowrap; }
        .item-description { font-size: 0.88rem; color: #b0b0b0; font-weight: 300; line-height: 1.4; }
        .footer { text-align: center; margin-top: 20px; font-size: 0.85rem; color: #888; }
        @media (max-width: 576px) { .menu-container { padding: 20px 15px; border-radius: 20px; } .header h1 { font-size: 2rem; } .menu-item { flex-direction: column; align-items: center; text-align: center; gap: 15px; padding: 20px 15px; } .item-img { width: 120px; height: 120px; } .item-header { flex-direction: column; align-items: center; gap: 5px; } }
    </style>
</head>
<body>
    <div class="menu-container">
        <a href="{% url 'home_url' %}" class="back-link">← Orqaga qaytish</a>
        <header class="header">
            <h1>Salatlar</h1>
        </header>

        <section class="menu-section">
            <div class="menu-grid">
                {% for item in salatlar %}
                <div class="menu-item">
                    <img src="{{ item.image_url }}" alt="{{ item.name }}" class="item-img">
                    <div class="item-details">
                        <div class="item-header">
                            <span class="item-name">{{ item.name }}</span>
                            <span class="item-price">{{ item.price }}</span>
                        </div>
                        <p class="item-description">{{ item.description }}</p>
                    </div>
                </div>
                {% empty %}
                <p style="text-align: center; grid-column: 1/-1; color: #ccc;">Hozircha bazada salatlar mavjud emas.</p>
                {% endfor %}
            </div>
        </section>

        <footer class="footer">
            <p>&copy; 2026 UY Choyxonasi. Barcha huquqlar himoyalangan.</p>
        </footer>
    </div>
</body>
</html>
